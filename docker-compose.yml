services:
  lavalink:
    build: .
    container_name: aeternus-lavalink
    restart: unless-stopped
    environment:
      PORT: "2333"
      LAVALINK_PASSWORD: "${LAVALINK_PASSWORD:-Aeternus-music}"
      YOUTUBE_REFRESH_TOKEN: "${YOUTUBE_REFRESH_TOKEN:-}"
      YOUTUBE_OAUTH_ENABLED: "${YOUTUBE_OAUTH_ENABLED:-true}"
      YOUTUBE_OAUTH_SKIP_INIT: "${YOUTUBE_OAUTH_SKIP_INIT:-true}"
    ports:
      - "2333:2333"
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
      - ./logs:/opt/Lavalink/logs
    healthcheck:
      # Endpoint real do Lavalink v4
      test: ["CMD", "curl", "-f", "http://127.0.0.1:2333/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
