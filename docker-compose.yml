version: '3.8'

services:
  lavalink:
    image: fredboat/lavalink:dev
    container_name: lavalink
    restart: unless-stopped
    environment:
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
    ports:
      - "2333:2333"
    volumes:
      - ./lavalink/config.yml:/opt/Lavalink/application.yml
      - ./lavalink/logs:/opt/Lavalink/logs
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
