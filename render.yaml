services:
  - type: web
    name: aeternus-lavalink
    env: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: LAVALINK_PASSWORD
        generateValue: true
      - key: YOUTUBE_PO_TOKEN
        sync: false
      - key: YOUTUBE_VISITOR_DATA
        sync: false
