server:
  # Local: 2333 | Render/Discloud: usam a PORT do host
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"

  server:
    # Senha fixa do Aeternus (pode sobrescrever com LAVALINK_PASSWORD no host)
    password: "${LAVALINK_PASSWORD:AeternusL4v@2026}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    youtubePlaylistLoadLimit: 50
    playerUpdateInterval: 5
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Ordem pensada para menos bloqueio (busca vs playback)
    clients:
      - MUSIC
      - ANDROID_VR
      - TVHTML5EMBEDDED
      - WEB
      - MWEB
      - IOS
    clientOptions:
      MUSIC:
        playback: false
        videoLoading: false
        searching: true
      ANDROID_VR:
        playback: true
        videoLoading: true
        searching: false
      TVHTML5EMBEDDED:
        playback: true
        videoLoading: true
        searching: false
      WEB:
        playback: false
        videoLoading: true
        searching: true
      MWEB:
        playback: false
        videoLoading: true
        searching: true
      IOS:
        playback: true
        videoLoading: true
        searching: false
    oauth:
      enabled: ${YOUTUBE_OAUTH_ENABLED:true}
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
      skipInitialization: ${YOUTUBE_OAUTH_SKIP_INIT:true}
    # Cipher remoto público (ajuda quando o YouTube muda o player)
    remoteCipher:
      url: "${YOUTUBE_CIPHER_URL:https://cipher.kikkia.dev/}"
      userAgent: "Aeternus-Lavalink"

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  level:
    root: INFO
    lavalink: INFO
