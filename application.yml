server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      youtube: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      mixer: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelmix: true
      lowpass: true
    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchLowestRate: 1
    gc-warnings: true

# YouTube Anti-Block Configuration
youtube:
  # Usar proxies para evitar bloqueios
  useHttpClientProxy: true
  # Timeouts
  searchTimeout: 10
  loadTimeout: 30
  # Retry configuration
  maxRetries: 3
  retryDelay: 1000
  # Rate limiting
  rateLimitDelay: 500
  # User-Agent rotation
  rotateUserAgent: true

# HTTP Client Configuration
httpClient:
  connectTimeout: 30000
  readTimeout: 30000
  requestTimeout: 30000

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""
  tags: {}

logging:
  file:
    max-history: 30
    max-size: 1GB
  level:
    root: INFO
    lavalink: INFO
    lavalink.server.io.jda.gateway: WARN
