server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "${LAVALINK_PASSWORD:Aeternus-music}"
    sources:
      youtube: false
      soundcloud: true
    bufferDurationMs: 1200
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - WEB
      - IOS
      - TVHTML5EMBEDDED
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:1//01-r9clFWh55LCgYIARAAGAESNwF-L9IrCFQSZNHAW1V17t2DrbkJTDqCW993fjXw6RS5qjgUjpVnIDRTqpIVCL6GLbpNY4WB8QU}"
    potoken:
      poToken: "${YOUTUBE_PO_TOKEN:}"
      visitorData: "${YOUTUBE_VISITOR_DATA:}"
